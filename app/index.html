<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Huxo App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1329;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      max-width: 500px;
    }
    h1 { color: #38bdf8; margin-bottom: 8px; }
    p { font-size: 16px; color: #94a3b8; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 15px;
      background-color: #10b981;
      color: #022c22;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enterprise Huxo App</h1>
    <p>Automated deployment running on <b>Amazon EKS</b> via <b>GitHub Actions</b>.</p>
    <p>Architecture: VPC + EKS + Private Subnets + Ingress-NGINX</p>
    <div class="badge">SYSTEM ONLINE & HEALTHY</div>
  </div>
</body>
</html>
